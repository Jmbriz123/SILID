name: Python baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned environment tool
        run: python -m pip install uv==0.11.23
      - name: Install from the committed lockfile
        run: uv sync --locked
      - name: Check installed dependencies
        run: uv pip check
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run offline unit tests
        run: uv run --locked pytest
      - name: Build the distributable package
        run: uv build
      - name: Install the built wheel against locked dependencies
        run: uv pip install --no-deps --reinstall dist/*.whl
      - name: Verify installed imports outside the checkout
        working-directory: /tmp
        run: >-
          "$GITHUB_WORKSPACE/.venv/bin/python" -c
          "import config.config; import config.cities; import ingestion.extract; import ingestion.load"
