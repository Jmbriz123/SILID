[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silid-weather"
version = "0.1.0"
description = "Philippine weather data engineering learning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.32.5",
    "psycopg2-binary==2.9.10",
    "SQLAlchemy==1.4.54",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.13.3"]

[tool.setuptools.packages.find]
include = ["config", "ingestion"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
